# SourbyCraft configuration (baseline, bundled in jar resources).
# Values here are read by patches via SourbyCraftConfig.ymlGet(...).
# PvP-only consumers wrap their ymlGet calls in `if (SourbyCraftConfig.pvpEnabled)`
# so these PvP-tuned values are effective only when the operator opts in via
# pvp.enabled in plugins/SourbyCraft/sourbycraft.yml.

pvp:
  enabled: false
  knockback:
    friction-divisor: 1.0
    vertical: 0.4
    extra-horizontal: 0.5
  no-attack-cooldown: true
  view-distance-cap: 6
  simulation-distance-cap: 5
  max-mobs-per-chunk: 4
  mob-ai-activation-range: 24

network:
  proxy-mode: velocity-modern
  netty:
    threads: auto-doubled
    snd-buf-kb: 64
    rcv-buf-kb: 64
    max-packets-per-tick: 100
  proxy-kick-grace-seconds: 5
  proxy-kick-fallback: lobby

entity-tracker:
  mob-range: 32
  item-range: 16
  xp-orb-range: 16
  player-update-interval: 1

combat:
  sweep-enabled: false
  hit-delay-ticks: 8
  hit-window-ms: 150
  fishing-rod-knockback: true
  reach-debug-command: true

branding:
  motd-suffix: false
  compact-plugin-list: true
  compact-plugin-log: true
  gc-advisor:
    enabled: true

auto-install:
  enabled: true

# UniverseSpigot config import — particles category (sub-project 00 Foundation reference impl).
# All toggles default to false → vanilla Paper behavior preserved.
# Changes to this file require a server restart; SourbyCraft does not support hot-reload.
particles:
  # Disable entity fall particles (UniverseSpigot: particles.disableFallParticles).
  disableFallParticles: false
  # Disable entity death particles (UniverseSpigot: particles.disableDeathParticles).
  disableDeathParticles: false
  # Disable block-break particles when a block is destroyed (UniverseSpigot: particles.disableBlockBreakParticles).
  disableBlockBreakParticles: false
  # Disable potion / status-effect ambient particles (UniverseSpigot: particles.disableEffectParticles).
  disableEffectParticles: false
  # Disable water-splash particles when an entity enters water (UniverseSpigot: particles.disableWaterSplashParticles).
  disableWaterSplashParticles: false
  # Disable sweep-attack and other 1.21+ combat particles (UniverseSpigot: particles.disableNewCombatParticles).
  disableNewCombatParticles: false

# UniverseSpigot config import — sounds category (sub-project 01).
# All toggles default to false → vanilla Paper behavior preserved.
sounds:
  # Disable parrot shoulder-perched ambient mimicry (UniverseSpigot: sounds.disableShoulderEntityAmbientSound).
  disableShoulderEntityAmbientSound: false
  # Suppress only the piglin anger ambient variant (other piglin ambient sounds unaffected) (UniverseSpigot: sounds.disablePiglinAngerSound).
  disablePiglinAngerSound: false
  # Disable entity footstep sounds across step + swim-step variants (UniverseSpigot: sounds.disableFootStepSounds).
  disableFootStepSounds: false
  # Disable PLAYER_ATTACK_* sound family from 1.9+ combat (UniverseSpigot: sounds.disableNewCombatSounds).
  disableNewCombatSounds: false
  # Disable shield-block impact sound (UniverseSpigot: sounds.disableShieldSounds).
  disableShieldSounds: false
  # Disable piston extend / retract sounds (UniverseSpigot: sounds.disablePistonSounds).
  disablePistonSounds: false

perf:
  # Skip-rate for entity ticking. 1 = tick every server tick (vanilla);
  # higher = skip ticks (less smooth movement, lower CPU).
  # Range 1..20. Default 20 (SourbyCraft historical default).
  # Operator sourbycraft.yml `entity.tick-rate` bridges into this knob at boot.
  # DynamicPerformanceScaler drives this knob automatically via /perf scale on.
  entity-tick-rate: 20
  sensor:
    # Multi-signal load sensor feeding the 5-tier state machine
    # (GREEN/YELLOW/ORANGE/RED/EMERGENCY). Runs on the main thread every
    # cadence-ticks ticks. P7 controller will read PerfSensor.currentTier().
    enabled: true
    cadence-ticks: 20                # 1s at 20 TPS
    dwell-samples: 3                 # samples in candidate tier required before escalation
    recovery-dwell-multiplier: 2.0   # recovery requires dwell-samples * multiplier samples
    warmup-ticks: 200                # ticks to skip at startup before sampling (10s at 20 TPS)
    thresholds:
      # TPS: lower value escalates worse. yellow=19.5 means TPS<19.5 -> at-least YELLOW.
      tps:           { yellow: 19.5, orange: 18.0, red: 15.0, emergency: 10.0 }
      # MSPT / mem / GC: higher value escalates worse.
      mspt:          { yellow: 30,   orange: 40,   red: 60,   emergency: 100 }
      mem:           { yellow: 75,   orange: 85,   red: 92,   emergency: 97 }
      gc-ms-per-min: { yellow: 20,   orange: 50,   red: 100,  emergency: 300 }
