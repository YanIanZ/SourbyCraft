name: Build & Boot Test

on:
  push:
    branches: [ release/26.2, main ]
  pull_request:
    branches: [ release/26.2, main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build 26.2 jar
    runs-on: ubuntu-24.04
    if: "!contains(github.event.head_commit.message, 'skip ci') && !contains(github.event.head_commit.message, 'ci skip')"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # paperweight needs git history for patch application

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: gradle

      - name: Set git identity (paperweight applies patches as commits)
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "Github Actions"
          git config --global --add safe.directory '*'

      - name: Publish SourbyPatcher to mavenLocal (build plugin for the Folia patcher)
        run: cd sourbypatcher && ./gradlew publishToMavenLocal --no-daemon --stacktrace -x test

      - name: Setup Metal (vendored — gen sources)
        run: bash scripts/setup_metal.sh

      - name: Apply all patches (Luminol 26.2 -> Folia)
        run: ./gradlew applyAllPatches --no-daemon --stacktrace

      - name: Test API and server; build metrics fixture
        run: ./gradlew -PincludeTestPlugin=true :sourbyapi:test :sourbycraft-server:test :test-plugin:test :test-plugin:jar --no-daemon --stacktrace

      - name: Compute next release number (rN — also stamped as build Nc)
        id: relnum
        run: |
          # Highest existing v26.2-rN tag (integer only) + 1. Composite tags like v26.2-r43.1
          # (hotfixes) are intentionally skipped — auto-releases always increment the integer
          # counter; hotfix tags are created manually and sit between two integer releases.
          last=$(git ls-remote --tags origin 'v26.2-r*' | sed -n 's#.*refs/tags/v26\.2-r\([0-9]*\)$#\1#p' | sort -n | tail -1)
          next=$(( ${last:-0} + 1 ))
          echo "next=$next" >> "$GITHUB_OUTPUT"
          echo "Next release: v26.2-r$next (build ${next}c)"

      - name: Build slim release jar (SourbyLoader)
        run: |
          # Release number == build number from r6 onward: the auto-updater compares the tag's rN
          # against the running jar's own build Nf, so the two MUST be stamped from the same counter.
          #
          # NOTE: the task is `slimServerJar` (registered in root build.gradle.kts:112) — not the
          # `slimPaperclipJar` name this workflow used pre-Canvas rebase. The Folia line at
          # release/26.2 had its own paperweight fork (`sourbypatcher/`) register a task under the
          # old name; this Canvas line uses the stock weaver toolchain, and the slim-jar task
          # was renamed to drop the paperclip assumption.
          ./gradlew slimServerJar --no-daemon --stacktrace -PsourbyBuild=${{ steps.relnum.outputs.next }}
          mkdir -p release
          cp build/libs/SourbyCraft-slim.jar release/SourbyCraft-26.2-REL.jar

      - name: Show build info
        run: |
          jar=$(ls release/SourbyCraft-*-REL.jar 2>/dev/null | head -1)
          echo "Built: $jar ($(du -h "$jar" | cut -f1))"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: SourbyCraft-26.2
          path: release/SourbyCraft-*-REL.jar
          if-no-files-found: error
          retention-days: 7

      - name: Upload metrics fixture
        uses: actions/upload-artifact@v4
        with:
          name: SourbyCraft-metrics-fixture
          path: test-plugin/build/libs/test-plugin-1.0.0.jar
          if-no-files-found: error
          retention-days: 7

  boot-test:
    name: Boot test (server reaches Done)
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: SourbyCraft-26.2
          path: run

      - name: Download metrics fixture
        uses: actions/download-artifact@v4
        with:
          name: SourbyCraft-metrics-fixture
          path: fixture

      - name: Boot server, verify metrics API, and stop cleanly
        working-directory: run
        run: |
          set -euo pipefail
          jar=$(find . -maxdepth 1 -type f -name 'SourbyCraft-*-REL.jar' -print -quit)
          test -n "$jar"
          fixture=../fixture/test-plugin-1.0.0.jar
          test -f "$fixture"
          mkdir -p plugins
          cp "$fixture" plugins/test-plugin-1.0.0.jar
          echo "eula=true" > eula.txt
          # keep the console-log short and offline so CI runs deterministically
          printf 'online-mode=false\nmax-players=1\nlevel-type=minecraft\\:flat\nspawn-protection=0\n' > server.properties
          echo "Booting $jar ..."
          mkfifo stdin.pipe
          java -Xmx2G -XX:+UseG1GC -jar "$jar" --nogui < stdin.pipe > server.log 2>&1 &
          PID=$!
          stdin_open=0
          java_status=
          cleanup_required=1

          close_stdin() {
            if [ "$stdin_open" -eq 1 ]; then
              exec 3>&- 2>/dev/null || true
              stdin_open=0
            fi
          }

          wait_for_exit() {
            local attempts=$1
            for _ in $(seq 1 "$attempts"); do
              if ! kill -0 "$PID" 2>/dev/null; then
                return 0
              fi
              sleep 1
            done
            # The process may exit during the final sleep.
            ! kill -0 "$PID" 2>/dev/null
          }

          reap_if_exited() {
            if kill -0 "$PID" 2>/dev/null; then
              return 1
            fi
            if wait "$PID"; then
              java_status=0
            else
              java_status=$?
            fi
            return 0
          }

          bounded_cleanup() {
            close_stdin
            if reap_if_exited; then
              return
            fi

            kill -TERM "$PID" 2>/dev/null || true
            if wait_for_exit 10; then
              reap_if_exited || true
              return
            fi

            kill -KILL "$PID" 2>/dev/null || true
            if wait_for_exit 10; then
              reap_if_exited || true
            else
              echo "Unable to confirm process $PID exited after SIGKILL."
            fi
          }

          show_log() {
            echo "----- last 40 log lines -----"
            tail -40 server.log || true
          }

          fail_after_launch() {
            local message=$1
            bounded_cleanup
            cleanup_required=0
            show_log
            if [ -n "$java_status" ]; then
              echo "Java exit status: $java_status"
            fi
            echo "$message"
            exit 1
          }

          cleanup_on_exit() {
            local shell_status=$?
            trap - EXIT
            if [ "$cleanup_required" -eq 1 ]; then
              bounded_cleanup
            fi
            exit "$shell_status"
          }

          trap cleanup_on_exit EXIT
          if exec 3> stdin.pipe; then
            stdin_open=1   # hold the write end open so the server keeps reading stdin
          else
            fail_after_launch "Could not open the server console FIFO."
          fi

          ready=0
          for _ in $(seq 1 240); do
            if grep -q 'Done (' server.log \
              && grep -q 'SOURBY_METRICS_ONLOAD_OK' server.log \
              && grep -q 'SOURBY_METRICS_ONENABLE_OK' server.log; then
              ready=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then echo "server process exited early"; break; fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            fail_after_launch "Server did not reach Done with both metrics markers within 240s."
          fi

          if ! printf 'tps\nmspt\nspark profiler info\nstop\n' >&3; then
            fail_after_launch "Server console closed before accepting smoke-test commands."
          fi
          close_stdin

          if ! wait_for_exit 60; then
            fail_after_launch "Server required forced cleanup after the 60s shutdown timeout."
          fi
          if ! reap_if_exited; then
            fail_after_launch "Server was still running after shutdown polling completed."
          fi
          cleanup_required=0
          show_log
          if [ "$java_status" -ne 0 ]; then
            echo "Server exited with status $java_status."
            exit 1
          fi
          grep -Eq 'SourbyCraft .*TPS' server.log \
            || { echo "TPS command output marker missing."; exit 1; }
          grep -Eq 'SourbyCraft .*MSPT' server.log \
            || { echo "MSPT command output marker missing."; exit 1; }
          grep -q 'Profiler is already running' server.log \
            || { echo "spark command output marker missing."; exit 1; }
          echo "Server reached Done, exposed metrics during load and enable, and exited cleanly."

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: SourbyCraft-26.2
          path: release

      - name: Build image (Dockerfile + entrypoint COPY paths)
        run: |
          jar=$(ls release/SourbyCraft-*-REL.jar | head -1)
          echo "Building image with $jar"
          docker build --build-arg JAR="$jar" -t sourbycraft:ci .

      - name: Inspect image (non-root user + entrypoint present)
        run: |
          docker run --rm --entrypoint sh sourbycraft:ci -c \
            'id -un; test -x /app/entrypoint.sh && echo entrypoint-ok; test -f /app/server.jar && echo jar-ok'

  release:
    name: Publish release (auto)
    runs-on: ubuntu-24.04
    needs: [build, boot-test, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/26.2'
    permissions:
      contents: write
    steps:
      - name: Checkout (tags + history for the changelog)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: SourbyCraft-26.2
          path: release

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          last=$(git tag -l 'v26.2-r*' | sed -n 's#^v26\.2-r\([0-9]*\)$#\1#p' | sort -n | tail -1)
          next=$(( ${last:-0} + 1 ))
          tag="v26.2-r$next"
          jar=$(ls release/SourbyCraft-*-REL.jar | head -1)
          sha=$(sha256sum "$jar" | cut -d' ' -f1)
          echo "$sha  $(basename "$jar")" > "$jar.sha256"
          title="$(TZ=Asia/Jakarta date '+%A, %d %B %Y, %H:%M') (GMT+7) — 26.2-r$next [$(git log -1 --format=%s | cut -c1-80)]"
          {
            echo "**Build ${next}c** — \`$(basename "$jar")\` (sha256 \`$sha\`)"
            echo
            echo "Auto-published from \`release/26.2\` after a green build + boot test."
            echo
            echo "## Commits"
            if [ -n "${last:-}" ]; then
              git log "v26.2-r$last"..HEAD --format='- %s' | head -40
            else
              git log -10 --format='- %s'
            fi
          } > notes.md
          gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --notes-file notes.md "$jar" "$jar.sha256"
