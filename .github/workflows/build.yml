name: Build & Boot Test

on:
  push:
    branches: [ release/26.2, main ]
  pull_request:
    branches: [ release/26.2, main ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build 26.2 jar
    runs-on: ubuntu-24.04
    if: "!contains(github.event.head_commit.message, 'skip ci') && !contains(github.event.head_commit.message, 'ci skip')"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # paperweight needs git history for patch application

      - name: Validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: gradle

      - name: Set git identity (paperweight applies patches as commits)
        run: |
          git config --global user.email "no-reply@github.com"
          git config --global user.name "Github Actions"
          git config --global --add safe.directory '*'

      - name: Verify patch parity
        run: bash scripts/verify-patch-parity.sh
        continue-on-error: true

      - name: Apply all patches (rebase onto Paper/MC 26.2)
        run: ./gradlew applyAllPatches --no-daemon --stacktrace

      - name: Compile server
        run: ./gradlew :sourbycraft-server:compileJava --no-daemon

      - name: Assemble release jar
        run: ./gradlew assembleReleaseArtifacts --no-daemon

      - name: Show build info
        run: |
          jar=$(ls release/SourbyCraft-*-REL.jar 2>/dev/null | head -1)
          echo "Built: $jar ($(du -h "$jar" | cut -f1))"
          unzip -p "$jar" META-INF/sourbycraft-build.properties 2>/dev/null || true

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: SourbyCraft-26.2
          path: release/SourbyCraft-*-REL.jar
          if-no-files-found: error
          retention-days: 7

  boot-test:
    name: Boot test (server reaches Done)
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: SourbyCraft-26.2
          path: run

      - name: Boot server, wait for Done, stop cleanly
        working-directory: run
        run: |
          set -u
          jar=$(ls SourbyCraft-*-REL.jar | head -1)
          echo "eula=true" > eula.txt
          # keep the console-log short and offline so CI runs deterministically
          printf 'online-mode=false\nmax-players=1\nlevel-type=minecraft\\:flat\nspawn-protection=0\n' > server.properties
          echo "Booting $jar ..."
          mkfifo stdin.pipe
          java -Xmx2G -XX:+UseG1GC -jar "$jar" --nogui < stdin.pipe > server.log 2>&1 &
          PID=$!
          exec 3> stdin.pipe   # hold the write end open so the server keeps reading stdin
          booted=0
          for i in $(seq 1 240); do
            if grep -q 'Done (' server.log; then booted=1; break; fi
            if ! kill -0 "$PID" 2>/dev/null; then echo "server process exited early"; break; fi
            sleep 1
          done
          echo "stop" >&3 || true   # request a clean shutdown
          exec 3>&-
          # give it up to 60s to shut down, then force
          for i in $(seq 1 60); do kill -0 "$PID" 2>/dev/null || break; sleep 1; done
          kill "$PID" 2>/dev/null || true
          echo "----- last 40 log lines -----"
          tail -40 server.log
          if [ "$booted" -eq 1 ]; then
            echo "✅ Server reached Done and was asked to stop."
          else
            echo "❌ Server did not reach Done within 240s."
            exit 1
          fi
