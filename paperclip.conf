# SourbyCraft JVM Configuration
# Supports Java 21-25

# GC — ZGC (low pause, ideal for Minecraft tick loop)
# Switch to G1GC if ZGC causes issues:
# -XX:+UseG1GC -XX:MaxGCPauseMillis=50
-XX:+UseZGC
-XX:+ZGenerational
-XX:SoftMaxHeapSize=10G
-XX:ConcGCThreads=2
-XX:ParallelGCThreads=4

# Memory
-XX:+UseStringDeduplication
-XX:+AlwaysPreTouch
-XX:+UseTransparentHugePages

# Java 21+ add-opens (for reflection access)
--add-opens java.base/java.util=ALL-UNNAMED
--add-opens java.base/java.lang=ALL-UNNAMED
--add-opens java.base/java.io=ALL-UNNAMED

# CPU
-XX:+UseAES
-XX:+UseAESIntrinsics
-XX:+PerfDisableSharedMem

# Netty
-Dio.netty.allocator.pageSize=8192
-Dio.netty.allocator.maxOrder=11

# Profiling (uncomment for JFR)
# -XX:StartFlightRecording=filename=server.jfr
