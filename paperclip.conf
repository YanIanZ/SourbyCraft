# SourbyCraft v4-REL JVM Startup Flags
# Usage: java @paperclip.conf -jar sourbycraft-paperclip-v4-REL-mojmap.jar --nogui

# Memory
-Xms128M
-XX:MaxRAMPercentage=95.0

# GC — ZGC
-XX:+UseZGC
-XX:+ZGenerational
-XX:SoftMaxHeapSize=10G
-XX:ConcGCThreads=2
-XX:ParallelGCThreads=4
-XX:ZCollectionInterval=5
-XX:ZUncommitDelay=300
-XX:ZAllocationSpikeTolerance=3

# Memory Tuning
-XX:+AlwaysPreTouch
-XX:+UseStringDeduplication
-XX:+UseContainerSupport

# JIT Compiler
-XX:CICompilerCount=2
-XX:TieredStopAtLevel=1

# Vector API (SIMD)
--add-modules=jdk.incubator.vector

# JLine Terminal
-Dterminal.jline=false
-Dterminal.ansi=true

# Netty
-Dio.netty.allocator.pageSize=8192
-Dio.netty.allocator.maxOrder=11
