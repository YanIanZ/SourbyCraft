# SourbyCraft JVM Startup Flags
# Usage: java @paperclip.conf -jar sourbycraft-paperclip.jar
# RAM: set via -Xms/-Xmx below, or use defaults (25% system RAM)

# Memory (uncomment and adjust for your server)
# -Xms4G
# -Xmx10G

# GC — ZGC (sub-millisecond pauses, ideal for tick loop)
-XX:+UseZGC
-XX:+ZGenerational
-XX:SoftMaxHeapSize=10G
-XX:ConcGCThreads=2
-XX:ParallelGCThreads=4
-XX:ZCollectionInterval=5
-XX:ZUncommitDelay=300
-XX:ZAllocationSpikeTolerance=3

# CDS — Class Data Sharing (requires first-run with -XX:ArchiveClassesAtExit=cds.jsa)
# Second run: uncomment -XX:SharedArchiveFile=cds.jsa for 40% faster startup
# -XX:SharedArchiveFile=cds.jsa

# Memory
-XX:+AlwaysPreTouch
-XX:+UseTransparentHugePages
-XX:+UseStringDeduplication
-XX:+UseContainerSupport
-XX:+UseNUMA

# JIT Compiler
-XX:CICompilerCount=2
-XX:TieredStopAtLevel=1

# Virtual Threads (Netty I/O)
-Djdk.virtualThreadScheduler.parallelism=4
-Djdk.virtualThreadScheduler.maxPoolSize=8

# CPU
-XX:+UseAES
-XX:+UseAESIntrinsics
-XX:+PerfDisableSharedMem

# Access (for libraries, plugins, reflection)
--add-opens java.base/java.util=ALL-UNNAMED
--add-opens java.base/java.lang=ALL-UNNAMED
--add-opens java.base/java.io=ALL-UNNAMED
--add-opens java.base/java.util.concurrent=ALL-UNNAMED
--add-opens java.base/java.net=ALL-UNNAMED
--add-opens java.base/java.text=ALL-UNNAMED

# Netty
-Dio.netty.allocator.pageSize=8192
-Dio.netty.allocator.maxOrder=11
-Dio.netty.allocator.useCacheForAllThreads=true

# Profiling (uncomment for JFR)
# -XX:StartFlightRecording=filename=server.jfr,maxsize=250M
