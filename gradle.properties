# SourbyCraft-on-Canvas build number — incrementing counter, effective id = "${sourbyBuild}c"
# (c = Canvas base). Bump this per release: 1 -> "build 1c", 2 -> "build 2c", ...
# Surfaced in /ver, the startup banner, and the JAR manifest Implementation-Version
# (which feeds the "[bootstrap] Loading" + "This server is running" boot lines).
sourbyBuild=4
clipVersion=3.0.20
weightVersion=2.0.19
# true for release, false for skip release, pre for pre-release
release=pre
# true for push to repo, false for skip push repo, auto for detect by release value
pushRepo=auto

