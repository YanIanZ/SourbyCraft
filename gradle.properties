# SourbyCraft-on-Canvas build number. Pure numeric values get the "c" (Canvas) suffix:
# 43 -> "build 43c", 43.1 -> "build 43.1c". Non-numeric values are used as-is:
# "44-hotfix" -> "build 44-hotfix". Surfaced in /ver, the startup banner, and the JAR
# manifest Implementation-Version. The auto-updater compares the raw value against
# GitHub release tags (e.g. v26.2-r43, v26.2-r43.1, v26.2-r44-hotfix).
sourbyBuild=43-hotfix
clipVersion=3.0.21
weightVersion=2.0.19
# true for release, false for skip release, pre for pre-release
release=pre
# true for push to repo, false for skip push repo, auto for detect by release value
pushRepo=auto

