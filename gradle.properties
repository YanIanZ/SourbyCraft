group=dev.iyanz.sourbycraft
mcVersion=26.2
apiVersion=26.2
releaseVersion=26.2
codename=metal
channel=STABLE
# SourbyCraft Folia build number — incrementing counter, effective id = "${sourbyBuild}f"
# (f = Folia). Bump this per release: 1 -> "build 1f", 2 -> "build 2f", ...
# Surfaced in /ver, the startup banner, and the JAR manifest Implementation-Version
# (which feeds the "[bootstrap] Loading" + "This server is running" boot lines).
sourbyBuild=3
clipVersion=3.0.18
weightVersion=2.0.15
# true for release, false for skip release, pre for pre-release
release=pre
# true for push to repo, false for skip push repo, auto for detect by release value
pushRepo=auto

# PIN: Folia 26.2 (archived upstream, frozen)
foliaRef=62034198de6d034bed025f34f48e8950b57c77ee

org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.vfs.watch=false
