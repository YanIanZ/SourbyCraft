group=dev.iyanz.sourbycraft
mcVersion=26.2
apiVersion=26.2
releaseVersion=26.2
codename=aurora-nexus
# Informational only: nothing in the build reads this. The artifact channel (REL/DEV/EXP)
# comes from the git branch; see sourbycraftSuffixProvider in build.gradle.kts.
channel=STABLE
# Public SourbyCraft build number. Upstream lineage is implementation provenance only.
# Public identity: SourbyCraft 26.2 Build 47 — Aurora Nexus.
sourbyBuild=47
clipVersion=3.0.26
weightVersion=2.0.19
# true for release, false for skip release, pre for pre-release. Read by the
# "Create GitHub release" step. Build 47 is not qualified (see
# docs/releases/26.2-build-47-aurora-nexus.md), so it publishes as a prerelease, which the
# auto-updater skips unless misc.auto_update.allow_prerelease is set. Switch to true only
# after every mandatory release gate passes.
release=pre
# true for push to repo, false for skip push repo, auto for detect by release value
pushRepo=auto

# PIN: Paper 26.2 (PaperMC/Paper). SourbyCraft's only upstream; Canvas/Folia changes are owned
# SourbyCraft patches and sources since the Aurora migration. 9240f586 is the Paper revision the
# last Canvas pin (2a3bf65c) built on, so the migration itself changes no upstream code.
paperRef=9240f586a4aa2623b3581e331817d527cbae2723

org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.vfs.watch=false

# Approved private toolchain artifacts; no remote Maven fallback.
patcherVersion=3.0.0
clipSha256=01f6afbec21cc3137fae3d5e7d081fbcadf44966ca8a4c61bc9ee002661d6145
patcherSha256=63cade096d66406a3ef8ab42e7767d60ab6cac9e37a1efc831f230387ee6f3f8
