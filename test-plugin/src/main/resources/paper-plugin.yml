name: SourbyCraft-Test-Plugin
version: ${version}
main: dev.iyanz.sourbycraft.testplugin.TestPlugin
description: SourbyCraft Test Plugin
author: iYanZ
api-version: '${api_version}'
folia-supported: true
load: STARTUP
bootstrapper: dev.iyanz.sourbycraft.testplugin.TestBootstrap
loader: dev.iyanz.sourbycraft.testplugin.TestLoader
defaultPerm: FALSE
permissions:
dependencies:
commands:
  massspawn:
    description: Spawn many entities at a position, batched across ticks.
    usage: /massspawn <type> <x> <y> <z> <count>
  flyspeed:
    description: Set a player's fly speed for extreme-range testing.
    usage: /flyspeed <0.0-1.0> [player]
