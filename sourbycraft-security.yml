crash-prevention:
  nbt:
    max-bytes: 2097152
    max-depth: 64
    max-string-length: 4096
    max-list-size: 65536
  sign:
    max-line-length: 256
    max-total-chars: 1024
  anvil:
    max-item-name-length: 128
  recipe-book:
    # reserved: 26.x recipe packets are fixed-size at the codec level; guards future protocol drift only
    max-packet-size: 20480
  creative-item:
    # encoded item size cap for creative slot packets; values below ~16384 silently block cloning filled shulkers/bundles
    max-nbt-size: 16384
packet-guard:
  book-edit:
    max-total-chars: 65536
  custom-payload:
    max-bytes: 8192
  container-click:
    max-per-tick: 20
  recipe-book:
    max-per-tick: 16
