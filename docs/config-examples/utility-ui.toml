# [console] section of sourbycraft_config/sourbycraft_global_config.toml (Build 49 layout; was [ui] +
# branding.gc-advisor.enabled before Build 49 — an old file is migrated automatically, copy kept as *.migrated).
# Merge this section into an existing file; the full example is sourbycraft_global_config.toml beside this one.
[console]
# RESTART_REQUIRED. Character set of SourbyCraft's startup lines: auto = rich on interactive
# terminals, otherwise plain; plain = ASCII dashes/hyphens; rich = Unicode box drawing/em dash.
# Not colour: time/level/tag are coloured only when the terminal supports ANSI
# (-Dterminal.ansi=false turns it off). JVM override: -Dsourbycraft.console=plain|rich|auto
style = "auto"
# LIVE after /sourbycraft reload. Same pagination for /plugins and /pl (1-40).
plugins-page-size = 12
# RESTART_REQUIRED. Startup GC / JVM-flag advisory.
gc-advisor = true
