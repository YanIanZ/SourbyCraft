# sourbycraft_config/aurora.toml — implemented defaults, not performance tuning.
# LIVE means explicit /sourbycraft reload; RESTART_REQUIRED means the next process.
# This file takes precedence over legacy Aurora keys in the utility TOML.

[aurora.entity]
# LIVE. Experimental/default-off; functional tests do not establish qualification.
async-pathfinding = false

[aurora.diagnostics]
# LIVE. Attribute per-thread CPU to execution lanes once per second.
lane-sampling = true

[aurora.diagnostics.stall-recorder]
# RESTART_REQUIRED (all five keys; the thread and its shutdown hook are created once at boot).
# When the global tick or an active region completes no tick for after-seconds, a daemon thread
# writes thread dumps (with lock owners) and memory/cgroup figures to logs/stalls/stall-<time>.txt.
# false = no thread, no hook. It reads volatile tick markers only; see docs/development/STALL-RECORDER.md.
enabled = true
after-seconds = 10
# Seconds between dumps while the same stall lasts, and how many dumps one stall may write
# (one more is written if the JVM shuts down during it). keep-files = newest stall files kept.
repeat-seconds = 10
max-dumps-per-stall = 6
keep-files = 20

[aurora.cpu]
# RESTART_REQUIRED. 0 = JVM-visible processors; explicit paper-global thread count wins.
cores = 0

[aurora.bridge]
# RESTART_REQUIRED. off = refuse undeclared plugins; safe = admit through Aurora Bridge.
# Neither admission nor a NATIVE label certifies a plugin's correctness.
mode = "off"
# LIVE. Cancel bridged work after this many fatal violations (minimum 1).
quarantine-after = 3
# LIVE. caller-region routes from a ticking caller's region; otherwise global.
# global always uses the global region, where world access is refused.
sync-route = "caller-region"
# RESTART_REQUIRED, read early. Effective only while mode = "safe"; mode = "off" keeps checks enforced.
# relaxed = advisory checks for every caller (LightingLuminol parity); bridged = advisory only in bridged
# task bodies; enforced = refuse foreign access. relaxed/bridged are unsafe and unqualified (data races,
# persisted corruption, item duplication, deadlocks possible). -Daurora.bridge.thread-checks= overrides this.
thread-checks = "relaxed"

[aurora.scheduler]
# RESTART_REQUIRED. Governed lane budgets; these do not resize active executors.
# 0 bridge threads = max(2, JVM-visible processors / 4).
bridge-io-threads = 0
bridge-io-queue = 256
# 0 storage threads = 1. Queues must be at least 1.
storage-threads = 1
storage-queue = 64

[aurora.network]
# LIVE. Stop/start wire-byte and packet counting for /perf network.
counters = true

[aurora.world]
# LIVE. Default-off. true runs command blocks and command-block minecarts under SourbyCraft's
# region rules (docs/architecture/command-blocks.md); the vanilla gamerule command_blocks_work
# (default true) must also be true. A repeating block that stopped while this was false needs re-arming.
command-blocks = false
# LIVE. Default-off. true runs the datapack tag #minecraft:tick once per server tick on the global
# tick (docs/architecture/datapack-functions.md). #minecraft:load runs once per boot either way.
tick-functions = false

[aurora.awf]
# All AWF settings RESTART_REQUIRED. Empty lists leave new worlds on region files.
# Existing AWF stores stay in use even after removing a name; use export to leave AWF.
worlds = []
# Move these worlds back to region files on next load; must not overlap worlds.
export = []
backend = "file"
persistence = "incremental"
# Writes become durable at commit/save-all/shutdown. A crash can lose this interval.
commit-interval-seconds = 30
# Clean chunks retained per storage; dirty chunks are never evicted by this limit.
resident-chunks = 1024
retained-generations = 3
commit-attempts = 3
# Delta-indexed generations (AWF-7). false = full index per commit, readable by builds before AWF-7
# (the auto-updater's rollback jar). Once deltas exist: set false and restart (every store the server opens
# is compacted at open), or run `/awf compact all` and check it prints "full: yes" for every store, before
# rolling back. A pre-AWF-7 build then skips the retained delta generations and DELETES the objects only
# they reference: those rollback points are lost for good. Back up the <folder>.awf directories first.
delta-generations = false
# Start a commit as soon as a storage's unsaved chunks hold at least this many bytes, without waiting for
# commit-interval-seconds. 0 = off (interval only). A trigger, not a cap: checked once a second, one commit per
# storage at a time, deletions count as 0 bytes.
commit-dirty-bytes = 0
# One budget (ms) for every AWF wait at shutdown: flushes, final commits, lock waits, Redis calls, lease release.
# Counted from the start of shutdown (so it includes the vanilla chunk save). When it passes, no further commit is
# attempted, open Redis connections are cut, every unconfirmed storage is logged and the stop ends with
# AWF-SHUTDOWN-INCOMPLETE and exit status 70 - never reported as saved. RESTART_REQUIRED.
shutdown-deadline-ms = 30000
